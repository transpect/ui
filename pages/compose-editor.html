            /* =====================================================================
            Import
            ===================================================================== */
            function importYaml(text) {
                if (typeof jsyaml === "undefined") {
                    toast(
                        "Import nicht verfügbar: Die Bibliothek js-yaml konnte nicht von cdnjs geladen werden (Internetverbindung prüfen).",
                        5000,
                    );
                    return;
                }
                let doc;
                try {
                    doc = jsyaml.load(text);
                } catch (e) {
                    toast(
                        `YAML konnte nicht gelesen werden: ${e.reason || e.message}`,
                        6000,
                    );
                    return;
                }
                if (
                    !doc ||
                    typeof doc !== "object" ||
                    !doc.services ||
                    typeof doc.services !== "object"
                ) {
                    toast(
                        "Die Datei enthält keinen Abschnitt „services“.",
                        5000,
                    );
                    return;
                }

                const notes = [];
                const dump = (obj) =>
                    jsyaml.dump(obj, { lineWidth: -1, noRefs: true }).trimEnd();
                const next = emptyState();
                next.name = typeof doc.name === "string" ? doc.name : "";

                const parseRes = (src, kind, prefix) => {
                    if (!src || typeof src !== "object") return [];
                    return Object.entries(src).map(([name, cfg]) => {
                        const r = {
                            id: uid(prefix),
                            name,
                            driver: "",
                            external: false,
                            raw: "",
                        };
                        if (cfg && typeof cfg === "object") {
                            const rest = Object.keys(cfg).filter(
                                (k) => !["driver", "external"].includes(k),
                            );
                            if (
                                rest.length ||
                                (cfg.external &&
                                    typeof cfg.external !== "boolean")
                            )
                                r.raw = dump(cfg);
                            else {
                                if (typeof cfg.driver === "string")
                                    r.driver = cfg.driver;
                                if (cfg.external === true) r.external = true;
                            }
                        }
                        return r;
                    });
                };
                next.volumes = parseRes(doc.volumes, "volumes", "v");
                next.networks = parseRes(doc.networks, "networks", "n");
                const netId = (name) => {
                    let n = next.networks.find((x) => x.name === name);
                    if (!n) {
                        n = { id: uid("n"), name, driver: "", external: false };
                        next.networks.push(n);
                        notes.push(
                            `Netzwerk „${name}“ war nicht deklariert und wurde ergänzt`,
                        );
                    }
                    return n.id;
                };

                const pendingDeps = [];
                for (const [key, cfg0] of Object.entries(doc.services)) {
                    const cfg = { ...(cfg0 || {}) };
                    const s = newService({ key });
                    const extra = {};
                    const take = (k) => {
                        const v = cfg[k];
                        delete cfg[k];
                        return v;
                    };

                    for (const k of [
                        "image",
                        "container_name",
                        "restart",
                        "working_dir",
                    ]) {
                        const v = take(k);
                        if (v == null) continue;
                        if (typeof v === "string" || typeof v === "number")
                            s[k] = String(v);
                        else extra[k] = v;
                    }
                    const build = take("build");
                    if (typeof build === "string") s.build = build;
                    else if (build != null) extra.build = build;
                    const cmd = take("command");
                    if (typeof cmd === "string") s.command = cmd;
                    else if (cmd != null) extra.command = cmd;

                    const ports = take("ports");
                    if (Array.isArray(ports)) {
                        if (ports.some((p) => p && typeof p === "object"))
                            extra.ports = ports;
                        else s.ports = ports.map(String);
                    } else if (ports != null) extra.ports = ports;
                    const env = take("environment");
                    if (Array.isArray(env))
                        s.environment = env.map((e) => {
                            const t = String(e);
                            const i = t.indexOf("=");
                            return i < 0
                                ? [t, ""]
                                : [t.slice(0, i), t.slice(i + 1)];
                        });
                    else if (env && typeof env === "object")
                        s.environment = Object.entries(env).map(([k, v]) => [
                            k,
                            v == null ? "" : String(v),
                        ]);

                    const vols = take("volumes");
                    if (Array.isArray(vols)) {
                        if (vols.some((v) => v && typeof v === "object"))
                            extra.volumes = vols;
                        else s.volumes = vols.map(String);
                    } else if (vols != null) extra.volumes = vols;
                    const nets = take("networks");
                    if (Array.isArray(nets))
                        s.networks = nets.map((n) => netId(String(n)));
                    else if (nets && typeof nets === "object") {
                        if (
                            Object.values(nets).some(
                                (c) =>
                                    c &&
                                    typeof c === "object" &&
                                    Object.keys(c).length,
                            )
                        ) {
                            extra.networks = nets;
                            Object.keys(nets).forEach((n) => netId(n));
                        } else
                            Object.keys(nets).forEach((n) =>
                                s.networks.push(netId(n)),
                            );
                    }
                    const deps = take("depends_on");
                    if (Array.isArray(deps))
                        deps.forEach((d) =>
                            pendingDeps.push({
                                s,
                                key: String(d),
                                condition: "service_started",
                            }),
                        );
                    else if (deps && typeof deps === "object") {
                        if (
                            Object.values(deps).some(
                                (c) =>
                                    c &&
                                    Object.keys(c).some(
                                        (k) => k !== "condition",
                                    ),
                            )
                        )
                            extra.depends_on = deps;
                        else
                            Object.entries(deps).forEach(([d, c]) =>
                                pendingDeps.push({
                                    s,
                                    key: d,
                                    condition:
                                        (c && c.condition) || "service_started",
                                }),
                            );
                    }

                    const hc = take("healthcheck");
                    if (hc && typeof hc === "object") {
                        const known = [
                            "test",
                            "interval",
                            "timeout",
                            "retries",
                        ];
                        const simpleTest =
                            typeof hc.test === "string" ||
                            Array.isArray(hc.test);
                        if (
                            !simpleTest ||
                            Object.keys(hc).some((k) => !known.includes(k))
                        )
                            extra.healthcheck = hc;
                        else {
                            s.hc.test =
                                typeof hc.test === "string"
                                    ? hc.test
                                    : hc.test[0] === "CMD-SHELL" &&
                                        hc.test.length === 2
                                      ? String(hc.test[1])
                                      : JSON.stringify(hc.test);
                            for (const k of ["interval", "timeout", "retries"])
                                if (hc[k] != null) s.hc[k] = String(hc[k]);
                        }
                    } else if (hc != null) extra.healthcheck = hc;

                    Object.assign(extra, cfg);
                    if (Object.keys(extra).length) s.extra = dump(extra);
                    next.services.push(s);
                }

                pendingDeps.forEach(({ s, key, condition }) => {
                    const t = next.services.find((x) => x.key === key);
                    if (t) s.depends_on.push({ id: t.id, condition });
                    else
                        notes.push(
                            `${s.key}: Abhängigkeit „${key}“ verweist auf keinen Dienst`,
                        );
                });

                const topExtra = {};
                for (const [k, v] of Object.entries(doc)) {
                    if (["name", "services", "volumes", "networks"].includes(k))
                        continue;
                    if (k === "version") {
                        notes.push(
                            "„version“ entfernt (in der Compose-Spezifikation obsolet)",
                        );
                        continue;
                    }
                    topExtra[k] = v;
                }
                if (Object.keys(topExtra).length) next.extra = dump(topExtra);

                state = next;
                selectedId = null;
                renderAll();
                toast(
                    notes.length
                        ? `Importiert. Hinweise: ${notes.join("; ")}.`
                        : `Importiert: ${state.services.length} Dienste.`,
                    notes.length ? 9000 : 2600,
                );
            }

            /* =====================================================================
            Kopieren & Herunterladen
            ===================================================================== */
            async function copyYaml() {
                const text = toYaml();
                try {
                    await navigator.clipboard.writeText(text);
                } catch (e) {
                    const ta = h("textarea", {
                        value: text,
                        style: "position:fixed;left:-9999px",
                    });
                    document.body.append(ta);
                    ta.select();
                    try {
                        document.execCommand("copy");
                    } catch (e2) {
                        toast(
                            "Kopieren nicht möglich. Bitte aus der YAML-Vorschau markieren.",
                        );
                        ta.remove();
                        return;
                    }
                    ta.remove();
                }
                toast("YAML kopiert.");
            }

            function downloadYaml() {
                const errors = issuesCache.filter(
                    (i) => i.level === "error",
                ).length;
                const blob = new Blob([toYaml()], {
                    type: "text/yaml;charset=utf-8",
                });
                const url = URL.createObjectURL(blob);
                const a = h("a", { href: url, download: "docker-compose.yml" });
                document.body.append(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1500);
                toast(
                    errors
                        ? `docker-compose.yml heruntergeladen – enthält noch ${errors} Fehler laut Prüfung.`
                        : "docker-compose.yml heruntergeladen.",
                    errors ? 4500 : 2400,
                );
            }

            /* =====================================================================
            Ereignisse
            ===================================================================== */
            $("#paletteFilter").addEventListener("input", renderPalette);
            $("#projName").addEventListener("input", (e) => {
                state.name = e.target.value;
                e.target.classList.toggle(
                    "invalid",
                    !!state.name.trim() && !PROJECT_RE.test(state.name.trim()),
                );
                changed();
            });
            $("#btnCopy").addEventListener("click", copyYaml);
            $("#btnCopy2").addEventListener("click", copyYaml);
            $("#btnDownload").addEventListener("click", downloadYaml);
            $("#btnNew").addEventListener("click", () => {
                if (
                    state.services.length &&
                    !confirm("Alle Dienste, Volumes und Netzwerke verwerfen?")
                )
                    return;
                state = emptyState();
                selectedId = null;
                renderAll();
            });
            $("#btnImport").addEventListener("click", () =>
                $("#fileImport").click(),
            );
            $("#fileImport").addEventListener("change", async (e) => {
                const f = e.target.files[0];
                if (!f) return;
                if (
                    state.services.length &&
                    !confirm(
                        "Die aktuelle Konfiguration wird durch den Import ersetzt. Fortfahren?",
                    )
                ) {
                    e.target.value = "";
                    return;
                }
                importYaml(await f.text());
                e.target.value = "";
            });
            $("#tabInsp").addEventListener("click", () => showTab("insp"));
            $("#tabYaml").addEventListener("click", () => showTab("yaml"));

            const board = $("#board");
            board.addEventListener("dragover", (e) => {
                if (
                    [...e.dataTransfer.types].includes(
                        "text/x-compose-template",
                    )
                ) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = "copy";
                    board.classList.add("drag-over");
                }
            });
            board.addEventListener("dragleave", (e) => {
                if (!board.contains(e.relatedTarget))
                    board.classList.remove("drag-over");
            });
            board.addEventListener("drop", (e) => {
                e.preventDefault();
                board.classList.remove("drag-over");
                const id = e.dataTransfer.getData("text/x-compose-template");
                if (id) addFromTemplate(id);
            });
            board.addEventListener("click", (e) => {
                if (e.target === board || e.target.id === "tiles") {
                    selectedId = null;
                    renderTiles();
                    renderInspector();
                }
            });
            if ("ResizeObserver" in window)
                new ResizeObserver(() => drawLinks()).observe(board);
            else window.addEventListener("resize", drawLinks);

            /* =====================================================================
            Start
            ===================================================================== */
            load();
            renderPalette();
            renderAll();
        </script>
    </body>
</html>
